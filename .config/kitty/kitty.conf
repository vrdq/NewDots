# ===================================================================
# 🎨 THEME & COLORS
# ===================================================================
# Import the auto-generated colors from Dusky's Matugen theme engine
include kitty-colors.conf

# Background opacity & blur (matches Hyprland aesthetic)
background_opacity 0.90

# ===================================================================
# 🖥️  FONTS
# ===================================================================
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

# Optimized for 1080p/1440p displays
font_size 12.0

# Enable ligatures
disable_ligatures never

# ===================================================================
# 📜 SCROLLBACK & HISTORY
# ===================================================================
scrollback_lines 100000
scrollback_pager_history_size 256

# ===================================================================
# Shell configuration: explicitly launch fish
shell /usr/bin/fish

# 🖱️  CURSOR & SHELL INTEGRATION
# ===================================================================
cursor_shape beam
cursor_blink_interval 0.5
cursor_underline_thickness 2.0
cursor_stop_blinking_after 2.0

# Neovide-like cursor trail effect
cursor_trail 10
cursor_trail_decay 0.15 0.4
cursor_trail_start_threshold 2

# Shell integration configuration
shell_integration no-cursor

# ===================================================================
# 🖼️  WINDOW & AESTHETICS (Hyprland Focused)
# ===================================================================
hide_window_decorations yes
confirm_os_window_close 0

# Clean internal padding so content doesn't touch the borders
window_padding_width 12

# Hyprland decides window size; without this kitty reopens maximized/fullscreen after a maximized window closes
remember_window_size no

# Force pure Wayland backend
linux_display_server wayland

# Silence the terminal bell
enable_audio_bell no

# ===================================================================
# ⚡ PERFORMANCE & LATENCY
# ===================================================================
sync_to_monitor no
input_delay 2
repaint_delay 6

# Disable built-in update checker
update_check_interval 0

# ===================================================================
# 📑 TABS (Powerline Style)
# ===================================================================
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol ⚡

active_tab_font_style   bold
inactive_tab_font_style normal

# ===================================================================
# ⌨️  ESSENTIAL KEYBINDINGS
# ===================================================================
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
