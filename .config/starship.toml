
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
[](#3b2d42)\
$os\
$username\
[](bg:#da627d fg:#3b2d42)\
$directory\
[](bg:#c6a0f6 fg:#da627d)\
$time\
[](fg:#c6a0f6)
$character"""

right_format = """$git_branch$git_status$cmd_duration"""

[os]
style = "bg:#3b2d42 fg:#e8b6f0 bold"
format = "[ $symbol]($style)"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰣇 "

[username]
show_always = true
style_user = "bg:#3b2d42 fg:#eae0e7 bold"
style_root = "bg:#3b2d42 fg:#ffb4ab bold"
format = "[$user ]($style)"
disabled = false

[directory]
style = "bg:#da627d fg:#161217 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[time]
disabled = false
time_format = "%R"
style = "bg:#c6a0f6 fg:#2f0a3a bold"
format = "[  $time ]($style)"

[git_branch]
symbol = " "
style = "bold #e8b6f0"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #f5b7b1"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"

[cmd_duration]
min_time = 2_000
style = "bold #eed49f"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](bold #e8b6f0) "
error_symbol = "[❯](bold #ffb4ab) "
vimcmd_symbol = "[❮](bold #a6da95) "
