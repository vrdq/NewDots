"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
[](#262b2e)\
$os\
$username\
[](bg:#8dcff1 fg:#262b2e)\
$directory\
[](bg:#262b2e fg:#8dcff1)\
$time\
[](fg:#262b2e)
$character"""

right_format = """$git_branch$git_status$cmd_duration"""

[os]
style = "bg:#262b2e fg:#8dcff1 bold"
format = "[ $symbol]($style)"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰣇 "

[username]
show_always = true
style_user = "bg:#262b2e fg:#dfe3e7 bold"
style_root = "bg:#262b2e fg:#ffb4ab bold"
format = "[$user ]($style)"
disabled = false

[directory]
style = "bg:#8dcff1 fg:#003548 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[time]
disabled = false
time_format = "%R"
style = "bg:#262b2e fg:#dfe3e7 bold"
format = "[  $time ]($style)"

[git_branch]
symbol = " "
style = "bold #8dcff1"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #b5cad7"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"

[cmd_duration]
min_time = 2_000
style = "bold #b5cad7"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](bold #8dcff1) "
error_symbol = "[❯](bold #ffb4ab) "
vimcmd_symbol = "[❮](bold #b5cad7) "
