"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
[](#262b26)\
$os\
$username\
[](bg:#99d4a3 fg:#262b26)\
$directory\
[](bg:#a2ced8 fg:#99d4a3)\
$time\
[](fg:#a2ced8)
$character"""

right_format = """$git_branch$git_status$cmd_duration"""

[os]
style = "bg:#262b26 fg:#99d4a3 bold"
format = "[ $symbol]($style)"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰣇 "

[username]
show_always = true
style_user = "bg:#262b26 fg:#dfe4dc bold"
style_root = "bg:#262b26 fg:#ffb4ab bold"
format = "[$user ]($style)"
disabled = false

[directory]
style = "bg:#99d4a3 fg:#003918 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[time]
disabled = false
time_format = "%R"
style = "bg:#a2ced8 fg:#01363e bold"
format = "[  $time ]($style)"

[git_branch]
symbol = " "
style = "bold #99d4a3"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #b7ccb7"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"

[cmd_duration]
min_time = 2_000
style = "bold #a2ced8"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](bold #99d4a3) "
error_symbol = "[❯](bold #ffb4ab) "
vimcmd_symbol = "[❮](bold #a2ced8) "
