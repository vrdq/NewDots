"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
[]({{colors.surface_container_high.default.hex}})\\
$os\\
$username\\
[](bg:{{colors.primary.default.hex}} fg:{{colors.surface_container_high.default.hex}})\\
$directory\\
[](bg:{{colors.tertiary.default.hex}} fg:{{colors.primary.default.hex}})\\
$time\\
[](fg:{{colors.tertiary.default.hex}})
$character"""

right_format = """$git_branch$git_status$cmd_duration"""

[os]
style = "bg:{{colors.surface_container_high.default.hex}} fg:{{colors.primary.default.hex}} bold"
format = "[ $symbol]($style)"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰣇 "

[username]
show_always = true
style_user = "bg:{{colors.surface_container_high.default.hex}} fg:{{colors.on_surface.default.hex}} bold"
style_root = "bg:{{colors.surface_container_high.default.hex}} fg:{{colors.error.default.hex}} bold"
format = "[$user ]($style)"
disabled = false

[directory]
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}} bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[time]
disabled = false
time_format = "%R"
style = "bg:{{colors.tertiary.default.hex}} fg:{{colors.on_tertiary.default.hex}} bold"
format = "[  $time ]($style)"

[git_branch]
symbol = " "
style = "bold {{colors.primary.default.hex}}"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold {{colors.secondary.default.hex}}"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"

[cmd_duration]
min_time = 2_000
style = "bold {{colors.tertiary.default.hex}}"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](bold {{colors.primary.default.hex}}) "
error_symbol = "[❯](bold {{colors.error.default.hex}}) "
vimcmd_symbol = "[❮](bold {{colors.tertiary.default.hex}}) "
