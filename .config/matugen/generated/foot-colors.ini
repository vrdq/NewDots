# ===================================================================
# 🎨 FOOT MATUGEN THEME 
# ===================================================================

[colors-dark]
# Cursor Colors (Format: <text-color> <cursor-color>)
cursor=cdc6b4 e8e2d4

# Base UI Colors
alpha=0.99
blur=yes
foreground=e8e2d4
background=15130b
selection-foreground=363016
selection-background=d1c6a2
urls=dac76f

# ===================================================================
# 16-COLOR TERMINAL PALETTE
# ===================================================================
# Normal colors
regular0=4c4c4c  # black
regular1=ac8a8c  # red
regular2=8aac8b  # green
regular3=aca98a  # yellow
regular4=dac76f  # blue (Matugen dynamically injected)
regular5=ac8aac  # magenta
regular6=8aacab  # cyan
regular7=e7e7e7  # white

# Bright colors
bright0=cdc6b4   # bright black (Matugen dynamically injected)
bright1=c49ea0   # bright red
bright2=9ec49f   # bright green
bright3=c4c19e   # bright yellow
bright4=dac76f   # bright blue (Matugen dynamically injected)
bright5=c49ec4   # bright magenta
bright6=9ec3c4   # bright cyan
bright7=f0f0f0   # bright white
