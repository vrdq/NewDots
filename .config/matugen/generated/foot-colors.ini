# ===================================================================
# 🎨 FOOT MATUGEN THEME 
# ===================================================================

[colors-dark]
# Cursor Colors (Format: <text-color> <cursor-color>)
cursor=cac4cf e6e1e9

# Base UI Colors
alpha=0.99
blur=yes
foreground=e6e1e9
background=141318
selection-foreground=322e41
selection-background=cbc3dc
urls=cebdff

# ===================================================================
# 16-COLOR TERMINAL PALETTE
# ===================================================================
# Normal colors
regular0=4c4c4c  # black
regular1=ac8a8c  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=cebdff  # blue (Matugen dynamically injected)
regular5=ac8aac  # magenta
regular6=8aacab  # cyan
regular7=e7e7e7  # white

# Bright colors
bright0=cac4cf   # bright black (Matugen dynamically injected)
bright1=c49ea0   # bright red
bright2=b5e8b0   # bright green
bright3=fae3b0   # bright yellow
bright4=cebdff   # bright blue (Matugen dynamically injected)
bright5=c49ec4   # bright magenta
bright6=9ec3c4   # bright cyan
bright7=f0f0f0   # bright white
