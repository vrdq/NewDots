# : Manager [[[

[mgr]
cwd = { fg = "#e8e2d4" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#77d390", bg = "#77d390" }
marker_cut      = { fg = "#c4eccf", bg = "#c4eccf" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a9d0b4", bg = "#a9d0b4" }

# Count
count_copied   = { fg = "#002110", bg = "#c4eccf" }
count_cut      = { fg = "#002110", bg = "#c4eccf" }
count_selected = { fg = "#393000", bg = "#a9d0b4" }

# Border
border_symbol = "│"
border_style  = { fg = "#dac76f" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#dac76f", bold = true, bg = "#15130b" }
inactive  = { fg = "#d1c6a2", bg = "#15130b" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#dac76f", fg = "#393000", bold = true }
normal_alt  = { bg = "#4b4739", fg = "#cdc6b4" }

# Select mode
select_main = { bg = "#d1c6a2", fg = "#363016", bold = true }
select_alt  = { bg = "#4b4739", fg = "#cdc6b4" }

# Unset mode
unset_main = { bg = "#a9d0b4", fg = "#143723", bold = true }
unset_alt  = { bg = "#4b4739", fg = "#cdc6b4" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#928148" }
perm_write = { fg = "#4f9162" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#50c771" }
perm_sep   = { fg = "#d8b30e" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#dac76f", bg = "#3c3930" }
progress_error  = { fg = "#ffb4ab", bg = "#3c3930" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = {}
border = { fg = "#dac76f" }
cand = { fg = "#dac76f" }
rest = { fg = "#cdc6b4" }
desc = { fg = "#e8e2d4" }
separator = " ▶ "
separator_style = { fg = "#e8e2d4" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#a9d0b4" }
title_warn  = { fg = "#dac76f" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#dac76f" }
active = { fg = "#a9d0b4", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#dac76f" }
title = { fg = "#dac76f" }
value  = { fg = "#e8e2d4" }
selected = { bg = "#524600", fg = "#f7e388" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#dac76f", bg = "#393000" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#dac76f" }
title   = {}
hovered = { fg = "#c4eccf", underline = true }

# : ]]]


# : Confirm [[[

[confirm]
border = { fg = "#dac76f" }
title  = { fg = "#dac76f" }

# : ]]]


# : Spot [[[

[spot]
border  = { fg = "#dac76f" }
title   = { fg = "#dac76f" }
tbl_col = { fg = "#dac76f" }

# : ]]]


# : Help [[[

[help]
border  = { fg = "#dac76f" }
chord   = { fg = "#dac76f" }
action  = {}
hovered = { reversed = true, bold = true }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e8e2d4" },
    { url = "*/", fg = "#dac76f" },
]

# : ]]]
